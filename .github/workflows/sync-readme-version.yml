name: Sync README Version Badge

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "release-*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Update README version badge
        run: Rscript scripts/update_readme_version.R

      - name: Commit changes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          if git diff --quiet README.md; then
            echo "No README version changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync README version badge from DESCRIPTION"
          git push
